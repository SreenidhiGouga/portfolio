name: 21f3001224@ds.study.iitm.ac.in

on:
  schedule:
    - cron: "30 7 * * *"  # Runs daily at 07:30 UTC
  workflow_dispatch:  # Allows manual trigger

jobs:
  daily-commit-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 21f3001224@ds.study.iitm.ac.in
        run: |
          echo "Update on $(date)" >> daily_update.txt
          git config user.name "GitHub Actions Bot"
          git config user.email "21f3001224@ds.study.iitm.ac.in"
          git add daily_update.txt
          git commit -m "Daily automated commit $(date)" || echo "No changes to commit"

      - name: Push commit 21f3001224@ds.study.iitm.ac.in
        run: |
          git push
